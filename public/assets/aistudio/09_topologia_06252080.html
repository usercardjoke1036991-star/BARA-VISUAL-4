    <main class="main" style="flex-direction:row;background:#08090a">

          <div><div style="color:#fff;font-weight:500">HELLO.bara</div>
          <div style="font-size:13px;color:var(--muted)">tipo: archivo</div></div>
        </div><div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;">

          <div><div style="color:#fff;font-weight:500">TipoRuta</div>
          <div style="font-size:13px;color:var(--muted)">tipo: tipo</div></div>
